<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Altr Stream — Source Abstraction & Data Infrastructure{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <!-- HTMX 1.9.12 for reactive UI -->
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
  <header class="navbar">
    <a href="/" class="nav-brand">
      <div class="brand-icon">⚡</div>
      <span class="brand-title">Altr Stream</span>
      <span class="brand-badge">MVP v0.1.0</span>
    </a>
    <nav class="nav-links">
      <a href="/" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">Dashboard</a>
      <a href="/admin/sources/new" class="nav-link {% if active_page == 'add_source' %}active{% endif %}">+ Add Source</a>
      <a href="/docs" target="_blank" class="nav-link">API Docs</a>
      <a href="/api/v1/health" target="_blank" class="nav-link">Health</a>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    Altr Stream — Part of the <strong>HelloAltr / Altr Mesh</strong> Ecosystem &bull; Physical Source Abstraction &amp; CDC
  </footer>
</body>
</html>
