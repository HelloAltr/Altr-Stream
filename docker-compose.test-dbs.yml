# Development & Integration Test Databases for Altr Stream
# Usage: docker compose -f docker-compose.test-dbs.yml up -d

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: altr-postgres-test
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=altr_test_db
      - POSTGRES_USER=altr_test_user
      - POSTGRES_PASSWORD=altr_test_pass
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U altr_test_user -d altr_test_db"]
      interval: 3s
      timeout: 5s
      retries: 5
    networks:
      - altr-network

  mysql-test:
    image: mysql:8.0
    container_name: altr-mysql-test
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=altr_test_db
      - MYSQL_USER=altr_test_user
      - MYSQL_PASSWORD=altr_test_pass
      - MYSQL_ROOT_PASSWORD=altr_root_pass
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "altr_test_user", "--password=altr_test_pass"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - altr-network

  mongodb-test:
    image: mongo:7.0
    container_name: altr-mongodb-test
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=altr_test_db
      - MONGO_INITDB_ROOT_USERNAME=altr_root_user
      - MONGO_INITDB_ROOT_PASSWORD=altr_root_pass
    volumes:
      - ./docker/mongodb/init.js:/docker-entrypoint-initdb.d/init.js:ro
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "-u", "altr_test_user", "-p", "altr_test_pass", "--authenticationDatabase", "admin"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - altr-network

volumes:
  postgres_data:
    driver: local
  mysql_data:
    driver: local
  mongodb_data:
    driver: local

networks:
  altr-network:
    driver: bridge
