services:
  altr-stream:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - ALTR_APP_VERSION=0.13.2-alpha
    image: ${ALTR_STREAM_IMAGE:-ghcr.io/helloaltr/altr-stream:0.13.2-alpha}
    container_name: altr-stream
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ALTR_STREAM_HOST=0.0.0.0
      - ALTR_STREAM_PORT=8000
      - ALTR_STREAM_DATABASE_URL=sqlite+aiosqlite:////app/data/altr_stream.db
      - ALTR_STREAM_STATIC_DIR=/app/static
      - ALTR_STREAM_DEBUG=false
    volumes:
      - altr_stream_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - altr-network

volumes:
  altr_stream_data:
    driver: local

networks:
  altr-network:
    driver: bridge