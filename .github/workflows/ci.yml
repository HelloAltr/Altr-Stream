name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests & Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run Pytest Suite
        run: pytest -v

  flutter-check:
    name: Flutter Analyzer & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/altr_stream_admin
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter Analyzer
        run: flutter analyze

      - name: Flutter Unit & Widget Tests
        run: flutter test

  docker-build-check:
    name: Production Docker Build Validation
    needs: [backend-test, flutter-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Canonical Version
        id: canonical_version
        run: |
          VERSION=$(python3 -c 'import re; print(re.search(r"__version__\s*=\s*\"([^\"]+)\"", open("src/altr_stream/__version__.py").read()).group(1))')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build Unified Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: altr-stream:ci-test
          build-args: |
            ALTR_APP_VERSION=${{ steps.canonical_version.outputs.version }}
