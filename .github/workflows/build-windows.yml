name: Build Windows Manager (Test Artifact)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Manager Version"
        required: false
        default: "1.2.0"
  push:
    branches:
      - "build-windows*"
      - "test-windows*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build-windows:
    name: Build Windows Portable Manager
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Go Installer Engine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          New-Item -ItemType Directory -Path packaging\windows\build -Force | Out-Null
          Push-Location packaging\engine
          go build -ldflags="-s -w" -o ..\windows\build\altr-installer-engine.exe .
          Copy-Item ..\windows\build\altr-installer-engine.exe ..\..\dist\altr-installer-engine.exe -Force
          Pop-Location
          Write-Host "✔ Go engine compiled successfully."

      - name: Build Flutter Windows Desktop
        shell: pwsh
        run: |
          Push-Location frontend\altr_stream_manager
          flutter pub get
          flutter build windows --release
          Pop-Location
          Write-Host "✔ Flutter Windows release build completed."

      - name: Embed Go Engine and Assemble Packages
        shell: pwsh
        run: |
          $releaseDir = "frontend\altr_stream_manager\build\windows\x64\runner\Release"
          Copy-Item "packaging\windows\build\altr-installer-engine.exe" "$releaseDir\" -Force
          Copy-Item "$releaseDir\altr_stream_manager.exe" "$releaseDir\Altr-Stream-Manager.exe" -Force
          if (Test-Path "packaging\templates\INSTALLER_README.md") {
            Copy-Item "packaging\templates\INSTALLER_README.md" "$releaseDir\README.txt" -Force
          }
          
          # Run manager packager
          $version = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "1.2.0"
          }
          python scripts\build_manager_packages.py --platform windows --version $version --skip-flutter-build
          Write-Host "✔ Distribution packages assembled."

      - name: Build Single-File Portable Executable (.exe)
        shell: pwsh
        run: |
          $releaseDir = "frontend\altr_stream_manager\build\windows\x64\runner\Release"
          $launcherDir = "packaging\windows\launcher"
          $appZip = "packaging\windows\launcher\app.zip"
          
          # Compress release directory into app.zip for launcher embedding
          Compress-Archive -Path "$releaseDir\*" -DestinationPath $appZip -Force
          
          $version = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "1.2.0"
          }
          
          Push-Location $launcherDir
          go build -ldflags="-s -w -H windowsgui -X main.AppVersion=$version" -o ..\..\..\dist\Altr-Stream-Manager-Portable.exe .
          Pop-Location
          
          # Restore clean placeholder app.zip via git
          git checkout -- packaging/windows/launcher/app.zip
          Write-Host "✔ Single-file portable executable compiled: dist\Altr-Stream-Manager-Portable.exe"

      - name: Build Inno Setup Installer (.exe)
        shell: pwsh
        run: |
          # Install Inno Setup 6
          choco install innosetup --no-progress -y
          
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $version = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "1.2.0"
          }
          
          $distDir = (Resolve-Path "dist").Path
          & $iscc "/DMyAppVersion=$version" "/DMyOutputDir=$distDir" "packaging\windows\Altr-Stream.iss"
          
          if (Test-Path "dist\Altr Stream Installer.exe") {
            Copy-Item "dist\Altr Stream Installer.exe" "dist\Altr-Stream-Manager-Setup.exe" -Force
          }
          Write-Host "✔ Inno Setup installer compiled: dist\Altr-Stream-Manager-Setup.exe"

      - name: Upload Single-File Portable Executable (Double-Click & Run)
        uses: actions/upload-artifact@v4
        with:
          name: Altr-Stream-Manager-Portable-EXE
          path: dist/Altr-Stream-Manager-Portable.exe
          retention-days: 7

      - name: Upload Setup Installer (Standard Windows Setup Wizard)
        uses: actions/upload-artifact@v4
        with:
          name: Altr-Stream-Manager-Setup-EXE
          path: |
            dist/Altr-Stream-Manager-Setup.exe
            dist/Altr Stream Installer.exe
          retention-days: 7

      - name: Upload Complete Release Folder (Manual Unzip)
        uses: actions/upload-artifact@v4
        with:
          name: Altr-Stream-Manager-Folder-ZIP
          path: frontend/altr_stream_manager/build/windows/x64/runner/Release/
          retention-days: 7

