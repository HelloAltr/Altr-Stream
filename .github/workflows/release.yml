name: Release & Distribution

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0-beta)"
        required: true
        default: "v1.0.0-beta"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build-macos:
    name: Build macOS GUI Installer
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Tag or Version
        id: version_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ github.event.inputs.tag }}"
          else
            RAW_TAG="${GITHUB_REF#refs/tags/}"
          fi
          CLEAN_VERSION="${RAW_TAG#v}"
          echo "tag=${RAW_TAG}" >> $GITHUB_OUTPUT
          echo "version=${CLEAN_VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build macOS Application Bundle & Archive
        run: |
          python3 scripts/build_macos_app.py \
            --version "${{ steps.version_info.outputs.version }}" \
            --image "ghcr.io/helloaltr/altr-stream:${{ steps.version_info.outputs.version }}" \
            --output-dir dist

      - name: Upload macOS Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/Altr-Stream_macOS_Installer.app.zip
          if-no-files-found: error
          retention-days: 1

  publish-container:
    name: Build, Publish & Release
    runs-on: ubuntu-latest
    needs: [build-macos]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Tag or Version
        id: version_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ github.event.inputs.tag }}"
          else
            RAW_TAG="${GITHUB_REF#refs/tags/}"
          fi
          CLEAN_VERSION="${RAW_TAG#v}"
          echo "tag=${RAW_TAG}" >> $GITHUB_OUTPUT
          echo "version=${CLEAN_VERSION}" >> $GITHUB_OUTPUT

      - name: Download macOS Installer Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: dist

      - name: Docker Meta Extraction
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/helloaltr/altr-stream
          tags: |
            type=raw,value=${{ steps.version_info.outputs.version }}
            type=raw,value=${{ steps.version_info.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(steps.version_info.outputs.tag, 'alpha') && !contains(steps.version_info.outputs.tag, 'beta') && !contains(steps.version_info.outputs.tag, 'rc') }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ALTR_APP_VERSION=${{ steps.version_info.outputs.version }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Package Release Assets & Installers
        run: |
          python3 scripts/package_release.py \
            --version "${{ steps.version_info.outputs.version }}" \
            --tag "${{ steps.version_info.outputs.tag }}" \
            --output-dir dist \
            --release-manifest-only \
            --no-bundle-gum

      - name: Verify Release Assets
        run: |
          ls -la dist/
          test -f dist/Altr-Stream-Installer.exe
          test -f dist/Altr-Stream_macOS_Installer.app.zip
          test -f dist/Altr-Stream_Linux_Installer.sh
          test -f dist/README.txt
          test -f dist/altr-stream-${{ steps.version_info.outputs.tag }}-deployment.tar.gz
          test -f dist/altr-stream-${{ steps.version_info.outputs.tag }}-deployment.zip
          test -f dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag }}
          name: Altr Stream ${{ steps.version_info.outputs.tag }}
          prerelease: ${{ contains(steps.version_info.outputs.tag, 'alpha') || contains(steps.version_info.outputs.tag, 'beta') || contains(steps.version_info.outputs.tag, 'rc') }}
          generate_release_notes: true
          files: |
            dist/Altr-Stream-Installer.exe
            dist/Altr-Stream_macOS_Installer.app.zip
            dist/Altr-Stream_Linux_Installer.sh
            dist/README.txt
            dist/altr-stream-${{ steps.version_info.outputs.tag }}-deployment.tar.gz
            dist/altr-stream-${{ steps.version_info.outputs.tag }}-deployment.zip
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
