name: Release & Distribution

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.0)"
        required: true
        default: "v1.2.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build-macos:
    name: Build macOS Manager (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Tag or Version
        id: version_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ github.event.inputs.tag }}"
          else
            RAW_TAG="${GITHUB_REF#refs/tags/}"
          fi
          CLEAN_VERSION="${RAW_TAG#v}"
          echo "tag=${RAW_TAG}" >> $GITHUB_OUTPUT
          echo "version=${CLEAN_VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Flutter macOS Desktop
        run: |
          cd frontend/altr_stream_manager
          flutter pub get
          flutter build macos --release
          cd ../..

      - name: Package macOS Manager DMG
        run: |
          python3 scripts/build_manager_packages.py \
            --platform macos \
            --version "${{ steps.version_info.outputs.version }}" \
            --skip-flutter-build \
            --output-dir dist

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-manager-dmg
          path: dist/Altr-Stream-Manager.dmg
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Build Windows Manager (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Tag or Version
        id: version_info
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $rawTag = "${{ github.event.inputs.tag }}"
          } else {
            $rawTag = "${env:GITHUB_REF}" -replace '^refs/tags/', ''
          }
          $cleanVersion = $rawTag -replace '^v', ''
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$rawTag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$cleanVersion"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Go Installer Engine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          New-Item -ItemType Directory -Path packaging\windows\build -Force | Out-Null
          Push-Location packaging\engine
          go build -ldflags="-s -w" -o ..\windows\build\altr-installer-engine.exe .
          Copy-Item ..\windows\build\altr-installer-engine.exe ..\..\dist\altr-installer-engine.exe -Force
          Pop-Location
          Write-Host "✔ Go engine compiled successfully."

      - name: Build Flutter Windows Desktop
        shell: pwsh
        run: |
          Push-Location frontend\altr_stream_manager
          flutter pub get
          flutter build windows --release
          Pop-Location
          Write-Host "✔ Flutter Windows release build completed."

      - name: Embed Go Engine and Assemble Packages
        shell: pwsh
        run: |
          $releaseDir = "frontend\altr_stream_manager\build\windows\x64\runner\Release"
          Copy-Item "packaging\windows\build\altr-installer-engine.exe" "$releaseDir\" -Force
          Copy-Item "$releaseDir\altr_stream_manager.exe" "$releaseDir\Altr-Stream-Manager.exe" -Force
          if (Test-Path "packaging\templates\INSTALLER_README.md") {
            Copy-Item "packaging\templates\INSTALLER_README.md" "$releaseDir\README.txt" -Force
          }
          $version = "${{ steps.version_info.outputs.version }}"
          python scripts\build_manager_packages.py --platform windows --version $version --skip-flutter-build
          Write-Host "✔ Distribution packages assembled."

      - name: Build Single-File Portable Executable (.exe)
        shell: pwsh
        run: |
          $releaseDir = "frontend\altr_stream_manager\build\windows\x64\runner\Release"
          $launcherDir = "packaging\windows\launcher"
          $appZip = "packaging\windows\launcher\app.zip"
          Compress-Archive -Path "$releaseDir\*" -DestinationPath $appZip -Force
          $version = "${{ steps.version_info.outputs.version }}"
          Push-Location $launcherDir
          go build -ldflags="-s -w -H windowsgui -X main.AppVersion=$version" -o ..\..\..\dist\Altr-Stream-Manager-Portable.exe .
          Pop-Location
          git checkout -- packaging/windows/launcher/app.zip
          Write-Host "✔ Single-file portable executable compiled: dist\Altr-Stream-Manager-Portable.exe"

      - name: Build Inno Setup Installer (.exe)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $version = "${{ steps.version_info.outputs.version }}"
          $distDir = (Resolve-Path "dist").Path
          & $iscc "/DMyAppVersion=$version" "/DMyOutputDir=$distDir" "packaging\windows\Altr-Stream.iss"
          if (Test-Path "dist\Altr Stream Installer.exe") {
            Copy-Item "dist\Altr Stream Installer.exe" "dist\Altr-Stream-Manager-Setup.exe" -Force
          }
          Write-Host "✔ Inno Setup installer compiled: dist\Altr-Stream-Manager-Setup.exe"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-manager-exes
          path: |
            dist/Altr-Stream-Manager-Portable.exe
            dist/Altr-Stream-Manager-Setup.exe
          if-no-files-found: error
          retention-days: 1

  publish-container:
    name: Build, Publish & Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Tag or Version
        id: version_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ github.event.inputs.tag }}"
          else
            RAW_TAG="${GITHUB_REF#refs/tags/}"
          fi
          CLEAN_VERSION="${RAW_TAG#v}"
          echo "tag=${RAW_TAG}" >> $GITHUB_OUTPUT
          echo "version=${CLEAN_VERSION}" >> $GITHUB_OUTPUT

      - name: Download macOS Installer Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-manager-dmg
          path: dist

      - name: Download Windows Installer Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-manager-exes
          path: dist

      - name: Docker Meta Extraction
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/helloaltr/altr-stream
          tags: |
            type=raw,value=${{ steps.version_info.outputs.version }}
            type=raw,value=${{ steps.version_info.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(steps.version_info.outputs.tag, 'alpha') && !contains(steps.version_info.outputs.tag, 'beta') && !contains(steps.version_info.outputs.tag, 'rc') }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ALTR_APP_VERSION=${{ steps.version_info.outputs.version }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package Release Assets & Installers
        run: |
          python3 scripts/package_release.py \
            --version "${{ steps.version_info.outputs.version }}" \
            --tag "${{ steps.version_info.outputs.tag }}" \
            --output-dir dist \
            --release-manifest-only \
            --no-bundle-gum

      - name: Compute Checksums for Final Release Assets
        run: |
          cd dist
          sha256sum \
            Altr-Stream-Manager.dmg \
            Altr-Stream-Manager-Portable.exe \
            Altr-Stream-Manager-Setup.exe \
            Altr-Stream_Linux_Installer.sh \
            "altr-stream-${{ steps.version_info.outputs.tag }}-deployment.tar.gz" \
            "altr-stream-${{ steps.version_info.outputs.tag }}-deployment.zip" > SHA256SUMS
          cat SHA256SUMS

      - name: Verify Release Assets
        run: |
          ls -la dist/
          test -f dist/Altr-Stream-Manager.dmg
          test -f dist/Altr-Stream-Manager-Portable.exe
          test -f dist/Altr-Stream-Manager-Setup.exe
          test -f dist/Altr-Stream_Linux_Installer.sh
          test -f "dist/altr-stream-${{ steps.version_info.outputs.tag }}-deployment.tar.gz"
          test -f "dist/altr-stream-${{ steps.version_info.outputs.tag }}-deployment.zip"
          test -f dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag }}
          name: Altr Stream ${{ steps.version_info.outputs.tag }}
          prerelease: ${{ contains(steps.version_info.outputs.tag, 'alpha') || contains(steps.version_info.outputs.tag, 'beta') || contains(steps.version_info.outputs.tag, 'rc') }}
          generate_release_notes: true
          files: |
            dist/Altr-Stream-Manager.dmg
            dist/Altr-Stream-Manager-Portable.exe
            dist/Altr-Stream-Manager-Setup.exe
            dist/Altr-Stream_Linux_Installer.sh
            dist/altr-stream-${{ steps.version_info.outputs.tag }}-deployment.tar.gz
            dist/altr-stream-${{ steps.version_info.outputs.tag }}-deployment.zip
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
