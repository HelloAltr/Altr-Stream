name: Release & Distribution

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.13.3-alpha)"
        required: true
        default: "v0.13.3-alpha"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  publish-container:
    name: Build, Publish & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Tag or Version
        id: version_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ github.event.inputs.tag }}"
          else
            RAW_TAG="${GITHUB_REF#refs/tags/}"
          fi
          # Strip leading 'v' if present for internal version defines
          CLEAN_VERSION="${RAW_TAG#v}"
          echo "tag=${RAW_TAG}" >> $GITHUB_OUTPUT
          echo "version=${CLEAN_VERSION}" >> $GITHUB_OUTPUT

      - name: Docker Meta Extraction
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/helloaltr/altr-stream
          tags: |
            type=raw,value=${{ steps.version_info.outputs.version }}
            type=raw,value=${{ steps.version_info.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(steps.version_info.outputs.tag, 'alpha') && !contains(steps.version_info.outputs.tag, 'beta') && !contains(steps.version_info.outputs.tag, 'rc') }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ALTR_APP_VERSION=${{ steps.version_info.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag }}
          name: Altr Stream ${{ steps.version_info.outputs.tag }}
          prerelease: ${{ contains(steps.version_info.outputs.tag, 'alpha') || contains(steps.version_info.outputs.tag, 'beta') || contains(steps.version_info.outputs.tag, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
